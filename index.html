<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Frontend Mentor | QR code component</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scrollbar-width: none;
      font-family: "Outfit", sans-serif;
    }

    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap');


    body {
      background: hsl(212, 45%, 89%);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .Qrbox {
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: start;
      align-items: center;
      gap: 10px;
      height: 350px;
      width: 250px;
      background: hsl(0, 0%, 100%);
      border-radius: 15px;
    }

    img {
      height: 60%;
      width: 100%;
      border-radius: 10px;
    }

    h1 {
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      color: hsl(218, 44%, 22%);
    }

    p {
      text-align: center;
      font-size: 15px;
      font-weight: 400;
      color: hsl(218, 44%, 22%);
    }

    .attribution {
      margin: 10px;
      font-size: 15px;
      text-align: center;
    }

    @media (max-width:375px) {
      .Qrbox {
        height: 450px;
        width: 250px;
      }

      img {
        height: 50%;
        width: 100%;
      }

      h1 {
        font-size: 15px;
      }

      p {
        font-size: 12px
      }
    }

    @media (min-width:1440px) {
      .Qrbox {
        height: 700px;
        width: 400px;
        gap: 40px;
      }

      img {
        height: 50%;
        width: 100%;
      }

      h1 {
        font-size: 30px;
      }

      p {
        font-size: 22px
      }
    }
  </style>
</head>

<body>
  <div class="Qrbox">
    <img src="./images/image-qr-code.png" alt="">
    <h1>
      Improve your front-end skills by building projects</h1>
    <p>
      Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
  </div>
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
    Coded by <a href="https://github.com/iwillbebigafter-star">MOTIS</a>.
  </div>
</body>

</html>
